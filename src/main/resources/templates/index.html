<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Интернет-магазин</h1>

    <ul>
        <li><a th:href="@{/catalog}">Каталог товаров</a></li>
        <li><a sec:authorize="isAuthenticated()" th:href="@{/cart}">Корзина</a></li>
        <li><a sec:authorize="hasRole('ADMIN')" th:href="@{/shop/products}">Управление товарами</a></li>
        <li><a sec:authorize="hasRole('ADMIN')" th:href="@{/shop/categories}">Управление категориями</a></li>
        <li><a sec:authorize="hasRole('ADMIN')" th:href="@{/shop/orders}">Управление заказами</a></li>
        <li><a th:href="@{/photo-cards}">Фотокарточки</a></li>
        <li><a th:href="@{/media}">Файлы</a></li>
    </ul>
</main>

</body>
</html>
