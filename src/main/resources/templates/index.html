<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('Главная')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <section class="bg-white border rounded p-4 p-md-5">
        <h1 class="mb-3">Социальная сеть</h1>
        <p class="lead mb-4">
            Здесь можно найти пользователей, заполнить профиль, отправить заявку в друзья и смотреть список друзей.
        </p>

        <div class="row g-3">
            <div class="col-md-6 col-lg-3">
                <a class="btn btn-primary w-100" th:href="@{/users}">Пользователи</a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a class="btn btn-outline-primary w-100" th:href="@{/profile}">Мой профиль</a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a class="btn btn-outline-primary w-100" th:href="@{/friends}">Друзья</a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a class="btn btn-outline-primary w-100" th:href="@{/friend-requests}">Заявки</a>
            </div>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>
