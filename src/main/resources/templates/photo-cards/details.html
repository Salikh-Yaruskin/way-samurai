<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${photoCard.title}">Фотокарточка</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <h1 th:text="${photoCard.title}">Название</h1>
    <p>Создана: <span th:text="${#temporals.format(photoCard.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span></p>

    <p>
        <a th:href="@{/photo-cards/{id}/edit(id=${photoCard.id})}">Редактировать</a>
    </p>
    <form th:action="@{/photo-cards/{id}/delete(id=${photoCard.id})}" method="post">
        <button type="submit">Удалить</button>
    </form>

    <p>
        <img th:src="@{/photo-cards/{id}/image(id=${photoCard.id})}" width="640" th:alt="${photoCard.title}">
    </p>
    <p th:text="${photoCard.description ?: 'Описание не заполнено'}">Описание</p>
    <p>Файл: <span th:text="${photoCard.originalFilename}">photo.jpg</span></p>
    <p>Тип: <span th:text="${photoCard.contentType}">image/jpeg</span></p>
</main>
</body>
</html>
