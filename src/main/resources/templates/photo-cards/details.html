<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${photoCard.title}">Фотокарточка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                <div>
                    <h1 class="h3 mb-1" th:text="${photoCard.title}">Название</h1>
                    <div class="text-secondary" th:text="${#temporals.format(photoCard.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</div>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-primary" th:href="@{/photo-cards/{id}/edit(id=${photoCard.id})}">Редактировать</a>
                    <form th:action="@{/photo-cards/{id}/delete(id=${photoCard.id})}" method="post">
                        <button class="btn btn-outline-danger" type="submit">Удалить</button>
                    </form>
                </div>
            </div>

            <img th:src="@{/photo-cards/{id}/image(id=${photoCard.id})}"
                 class="img-fluid rounded border mb-3"
                 th:alt="${photoCard.title}">

            <p th:text="${photoCard.description ?: 'Описание не заполнено'}">Описание</p>

            <dl class="row">
                <dt class="col-sm-3">Файл</dt>
                <dd class="col-sm-9" th:text="${photoCard.originalFilename}">photo.jpg</dd>
                <dt class="col-sm-3">Тип</dt>
                <dd class="col-sm-9" th:text="${photoCard.contentType}">image/jpeg</dd>
            </dl>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
