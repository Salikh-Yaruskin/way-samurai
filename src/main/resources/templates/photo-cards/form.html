<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create'} ? 'Новая фотокарточка' : 'Редактирование фотокарточки'">Фотокарточка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="card mx-auto" style="max-width: 760px;">
        <div class="card-body">
            <h1 class="h3 mb-3" th:text="${mode == 'create'} ? 'Новая фотокарточка' : 'Редактирование фотокарточки'">Фотокарточка</h1>

            <form th:action="${mode == 'create'} ? @{/photo-cards} : @{/photo-cards/{id}(id=${photoCard.id})}"
                  th:object="${form}"
                  method="post"
                  enctype="multipart/form-data">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка сохранения</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="title">Название</label>
                    <input class="form-control" id="title" th:field="*{title}" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="description">Описание</label>
                    <textarea class="form-control" id="description" rows="4" th:field="*{description}" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="photo">Фотография</label>
                    <input class="form-control" id="photo" type="file" th:field="*{photo}" accept="image/*">
                    <div class="form-text" th:if="${mode == 'edit'}">Оставьте поле пустым, если не хотите менять фотографию.</div>
                </div>

                <div class="mb-3" th:if="${mode == 'edit'}">
                    <img th:src="@{/photo-cards/{id}/image(id=${photoCard.id})}"
                         class="img-fluid rounded border"
                         style="max-height: 260px;"
                         th:alt="${photoCard.title}">
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                    <a class="btn btn-outline-secondary" th:href="@{/photo-cards}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
