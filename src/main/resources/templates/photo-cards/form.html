<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create'} ? 'Новая фотокарточка' : 'Редактирование фотокарточки'">Фотокарточка</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1 th:text="${mode == 'create'} ? 'Новая фотокарточка' : 'Редактирование фотокарточки'">Фотокарточка</h1>

    <form th:action="${mode == 'create'} ? @{/photo-cards} : @{/photo-cards/{id}(id=${photoCard.id})}" th:object="${form}" method="post" enctype="multipart/form-data">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка сохранения</p>
        </div>

        <p>
            <label for="title">Название</label><br>
            <input id="title" th:field="*{title}">
        </p>
        <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Ошибка названия</p>

        <p>
            <label for="description">Описание</label><br>
            <textarea id="description" rows="4" th:field="*{description}"></textarea>
        </p>
        <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Ошибка описания</p>

        <p>
            <label for="photo">Фотография</label><br>
            <input id="photo" type="file" th:field="*{photo}" accept="image/*">
        </p>
        <p th:if="${mode == 'edit'}">Оставьте поле пустым, если не хотите менять фотографию.</p>

        <p th:if="${mode == 'edit'}">
            <img th:src="@{/photo-cards/{id}/image(id=${photoCard.id})}" width="320" th:alt="${photoCard.title}">
        </p>

        <button type="submit">Сохранить</button>
        <a th:href="@{/photo-cards}">Отмена</a>
    </form>
</main>
</body>
</html>
