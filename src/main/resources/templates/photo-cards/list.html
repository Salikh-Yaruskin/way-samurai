<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Фотокарточки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Фотокарточки</h1>
        <a class="btn btn-primary" th:href="@{/photo-cards/new}">Создать</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/photo-cards}">
        <div class="row g-3 align-items-end">
            <div class="col-md-9">
                <label class="form-label" for="search">Поиск</label>
                <input class="form-control" id="search" name="search" th:value="${search}" placeholder="Название или описание">
            </div>
            <div class="col-md-3">
                <button class="btn btn-outline-primary w-100" type="submit">Найти</button>
            </div>
        </div>
    </form>

    <div class="alert alert-secondary" th:if="${photoCards.empty}">
        Фотокарточки не найдены.
    </div>

    <div class="row g-3" th:if="${!photoCards.empty}">
        <div class="col-md-6 col-xl-4" th:each="photoCard : ${photoCards.content}">
            <div class="card h-100 shadow-sm">
                <img th:src="@{/photo-cards/{id}/image(id=${photoCard.id})}"
                     class="card-img-top object-fit-cover"
                     style="height: 220px;"
                     th:alt="${photoCard.title}">
                <div class="card-body">
                    <h2 class="h5" th:text="${photoCard.title}">Название</h2>
                    <p class="text-secondary small mb-3" th:text="${photoCard.description ?: 'Описание не заполнено'}">Описание</p>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/photo-cards/{id}(id=${photoCard.id})}">Открыть</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${photoCards.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${photoCards.first} ? 'disabled'">
                <a class="page-link" th:href="@{/photo-cards(search=${search},page=${photoCards.number - 1})}">Назад</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, photoCards.totalPages - 1)}"
                th:classappend="${pageNumber == photoCards.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/photo-cards(search=${search},page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${photoCards.last} ? 'disabled'">
                <a class="page-link" th:href="@{/photo-cards(search=${search},page=${photoCards.number + 1})}">Вперед</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
