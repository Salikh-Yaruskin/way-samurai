<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Фотокарточки</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Фотокарточки</h1>
    <p><a th:href="@{/photo-cards/new}">Создать</a></p>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <form method="get" th:action="@{/photo-cards}">
        <p>
            <label for="search">Поиск</label><br>
            <input id="search" name="search" th:value="${search}" placeholder="Название или описание">
        </p>
        <button type="submit">Найти</button>
    </form>

    <p th:if="${photoCards.empty}">Фотокарточки не найдены.</p>

    <div th:if="${!photoCards.empty}">
        <article th:each="photoCard : ${photoCards.content}">
            <h2 th:text="${photoCard.title}">Название</h2>
            <img th:src="@{/photo-cards/{id}/image(id=${photoCard.id})}" width="320" th:alt="${photoCard.title}">
            <p th:text="${photoCard.description ?: 'Описание не заполнено'}">Описание</p>
            <p><a th:href="@{/photo-cards/{id}(id=${photoCard.id})}">Открыть</a></p>
            <hr>
        </article>
    </div>

    <p th:if="${photoCards.totalPages > 1}">
        <a th:if="${!photoCards.first}" th:href="@{/photo-cards(search=${search},page=${photoCards.number - 1})}">Назад</a>
        <span th:each="pageNumber : ${#numbers.sequence(0, photoCards.totalPages - 1)}">
            <a th:if="${pageNumber != photoCards.number}" th:href="@{/photo-cards(search=${search},page=${pageNumber})}" th:text="${pageNumber + 1}">1</a>
            <strong th:if="${pageNumber == photoCards.number}" th:text="${pageNumber + 1}">1</strong>
        </span>
        <a th:if="${!photoCards.last}" th:href="@{/photo-cards(search=${search},page=${photoCards.number + 1})}">Вперед</a>
    </p>
</main>
</body>
</html>
