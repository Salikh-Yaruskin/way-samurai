<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <h1 class="h3 mb-3">Корзина</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(lines)}">
        Корзина пуста. Перейдите в каталог и добавьте товары.
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(lines)}">
        <div class="col-lg-8">
            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Товар</th>
                            <th>Цена</th>
                            <th>Количество</th>
                            <th>Сумма</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="line : ${lines}">
                            <td>
                                <a th:href="@{/catalog/products/{id}(id=${line.product.id})}" th:text="${line.product.name}">Товар</a>
                            </td>
                            <td th:text="${line.product.price}">0</td>
                            <td>
                                <form th:action="@{/cart/items}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="productId" th:value="${line.product.id}">
                                    <input class="form-control" style="width: 90px;" type="number" name="quantity" min="0" th:value="${line.quantity}">
                                    <button class="btn btn-outline-primary btn-sm" type="submit">Обновить</button>
                                </form>
                            </td>
                            <td th:text="${line.total}">0</td>
                            <td>
                                <form th:action="@{/cart/items/delete}" method="post">
                                    <input type="hidden" name="productId" th:value="${line.product.id}">
                                    <button class="btn btn-outline-danger btn-sm" type="submit">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5">Оформление</h2>
                    <p class="fs-5">
                        Итого: <strong th:text="${total}">0</strong> руб.
                    </p>

                    <form th:action="@{/cart/checkout}" th:object="${checkoutForm}" method="post">
                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="customerName">Имя покупателя</label>
                            <input class="form-control" id="customerName" th:field="*{customerName}" th:classappend="${#fields.hasErrors('customerName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="customerEmail">Email</label>
                            <input class="form-control" id="customerEmail" th:field="*{customerEmail}" th:classappend="${#fields.hasErrors('customerEmail')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Купить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
