<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Корзина</h1>

    <p th:if="${message}" th:text="${message}">Сообщение</p>
    <p th:if="${#lists.isEmpty(lines)}">Корзина пуста. Перейдите в каталог и добавьте товары.</p>

    <table th:if="${!#lists.isEmpty(lines)}" border="1">
        <thead>
        <tr>
            <th>Товар</th>
            <th>Цена</th>
            <th>Количество</th>
            <th>Сумма</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="line : ${lines}">
            <td><a th:href="@{/catalog/products/{id}(id=${line.product.id})}" th:text="${line.product.name}">Товар</a></td>
            <td th:text="${line.product.price}">0</td>
            <td>
                <form th:action="@{/cart/items}" method="post">
                    <input type="hidden" name="productId" th:value="${line.product.id}">
                    <input type="number" name="quantity" min="0" th:value="${line.quantity}">
                    <button type="submit">Обновить</button>
                </form>
            </td>
            <td th:text="${line.total}">0</td>
            <td>
                <form th:action="@{/cart/items/delete}" method="post">
                    <input type="hidden" name="productId" th:value="${line.product.id}">
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <section th:if="${!#lists.isEmpty(lines)}">
        <h2>Оформление</h2>
        <p>Итого: <strong th:text="${total}">0</strong> руб.</p>

        <form th:action="@{/cart/checkout}" th:object="${checkoutForm}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка</p>
            </div>

            <p>
                <label for="customerName">Имя покупателя</label><br>
                <input id="customerName" th:field="*{customerName}">
            </p>
            <p th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}">Ошибка имени</p>

            <p>
                <label for="customerEmail">Email</label><br>
                <input id="customerEmail" th:field="*{customerEmail}">
            </p>
            <p th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}">Ошибка email</p>

            <button type="submit">Купить</button>
        </form>
    </section>
</main>
</body>
</html>
