<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Товар</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <p><a th:href="@{/catalog}">Назад в каталог</a></p>

    <h1 th:text="${product.name}">Товар</h1>
    <p>Артикул: <span th:text="${product.sku}">SKU</span></p>
    <p>Цена: <span th:text="${product.price}">0</span> руб.</p>
    <p>Остаток: <span th:text="${product.stockQuantity}">0</span></p>
    <p>
        Основная категория:
        <span th:if="${product.primaryCategory != null}" th:text="${product.primaryCategory.name}">Категория</span>
        <span th:if="${product.primaryCategory == null}">Не выбрана</span>
    </p>

    <h2>Дополнительные категории</h2>
    <p th:if="${#sets.isEmpty(product.categories)}">Нет</p>
    <ul th:if="${!#sets.isEmpty(product.categories)}">
        <li th:each="category : ${product.categories}" th:text="${category.name}">Категория</li>
    </ul>

    <form sec:authorize="isAuthenticated()" th:action="@{/catalog/cart}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">
        <label>
            Количество
            <input type="number" name="quantity" min="1" value="1">
        </label>
        <button type="submit">Добавить в корзину</button>
    </form>

    <p sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Войти, чтобы купить</a>
    </p>
</main>
</body>
</html>
