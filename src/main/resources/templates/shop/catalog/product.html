<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name}">Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <a th:href="@{/catalog}" class="btn btn-outline-secondary mb-3">Назад в каталог</a>

    <div class="card">
        <div class="card-body">
            <h1 class="h3" th:text="${product.name}">Товар</h1>
            <p class="text-secondary">Артикул: <span th:text="${product.sku}">SKU</span></p>

            <dl class="row">
                <dt class="col-sm-3">Цена</dt>
                <dd class="col-sm-9">
                    <span th:text="${product.price}">0</span> руб.
                </dd>
                <dt class="col-sm-3">Остаток</dt>
                <dd class="col-sm-9" th:text="${product.stockQuantity}">0</dd>
                <dt class="col-sm-3">Основная категория</dt>
                <dd class="col-sm-9">
                    <span th:if="${product.primaryCategory != null}" th:text="${product.primaryCategory.name}">Категория</span>
                    <span th:if="${product.primaryCategory == null}" class="text-secondary">Не выбрана</span>
                </dd>
                <dt class="col-sm-3">Дополнительные категории</dt>
                <dd class="col-sm-9">
                    <span th:if="${#sets.isEmpty(product.categories)}" class="text-secondary">Нет</span>
                    <span class="badge text-bg-secondary me-1"
                          th:each="category : ${product.categories}"
                          th:text="${category.name}">
                        Категория
                    </span>
                </dd>
            </dl>

            <form sec:authorize="isAuthenticated()" th:action="@{/catalog/cart}" method="post" class="d-flex gap-2">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input class="form-control" style="max-width: 100px;" type="number" name="quantity" min="1" value="1">
                <button class="btn btn-primary" type="submit">Добавить в корзину</button>
            </form>

            <a sec:authorize="isAnonymous()" class="btn btn-primary" th:href="@{/login}">
                Войти, чтобы купить
            </a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
