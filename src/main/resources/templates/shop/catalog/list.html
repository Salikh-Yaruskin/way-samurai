<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Каталог товаров</h1>

    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <form method="get" th:action="@{/catalog}">
        <p>
            <label for="search">Поиск</label><br>
            <input id="search" name="search" th:value="${search}" placeholder="Название или артикул">
        </p>
        <p>
            <label for="categoryId">Категория</label><br>
            <select id="categoryId" name="categoryId">
                <option value="">Все категории</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:selected="${categoryId != null and category.id == categoryId}"
                        th:text="${category.name}">
                    Категория
                </option>
            </select>
        </p>
        <button type="submit">Найти</button>
    </form>

    <p th:if="${products.empty}">Товары не найдены.</p>

    <div th:if="${!products.empty}">
        <article th:each="product : ${products.content}">
            <h2 th:text="${product.name}">Товар</h2>
            <p>Артикул: <span th:text="${product.sku}">SKU</span></p>
            <p>Цена: <span th:text="${product.price}">0</span> руб.</p>
            <p>Остаток: <span th:text="${product.stockQuantity}">0</span></p>
            <p><a th:href="@{/catalog/products/{id}(id=${product.id})}">Подробнее</a></p>

            <form sec:authorize="isAuthenticated()" th:action="@{/catalog/cart}" method="post">
                <input type="hidden" name="productId" th:value="${product.id}">
                <label>
                    Количество
                    <input type="number" name="quantity" min="1" value="1">
                </label>
                <button type="submit">В корзину</button>
            </form>

            <p sec:authorize="isAnonymous()">
                <a th:href="@{/login}">Войти для покупки</a>
            </p>
            <hr>
        </article>
    </div>

    <p th:if="${products.totalPages > 1}">
        <a th:if="${!products.first}" th:href="@{/catalog(search=${search},categoryId=${categoryId},page=${products.number - 1})}">Назад</a>
        <span th:each="pageNumber : ${#numbers.sequence(0, products.totalPages - 1)}">
            <a th:if="${pageNumber != products.number}"
               th:href="@{/catalog(search=${search},categoryId=${categoryId},page=${pageNumber})}"
               th:text="${pageNumber + 1}">1</a>
            <strong th:if="${pageNumber == products.number}" th:text="${pageNumber + 1}">1</strong>
        </span>
        <a th:if="${!products.last}" th:href="@{/catalog(search=${search},categoryId=${categoryId},page=${products.number + 1})}">Вперед</a>
    </p>
</main>
</body>
</html>
