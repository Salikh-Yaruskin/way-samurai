<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Каталог товаров</h1>
        <a class="btn btn-outline-primary" sec:authorize="isAuthenticated()" th:href="@{/cart}">
            Корзина
        </a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/catalog}">
        <div class="row g-3 align-items-end">
            <div class="col-md-6">
                <label class="form-label" for="search">Поиск</label>
                <input class="form-control" id="search" name="search" th:value="${search}" placeholder="Название или артикул">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="categoryId">Категория</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">Все категории</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:selected="${categoryId != null and category.id == categoryId}"
                            th:text="${category.name}">
                        Категория
                    </option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" type="submit">Найти</button>
            </div>
        </div>
    </form>

    <div class="alert alert-secondary" th:if="${products.empty}">
        Товары не найдены.
    </div>

    <div class="row g-3" th:if="${!products.empty}">
        <div class="col-md-6 col-xl-4" th:each="product : ${products.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5" th:text="${product.name}">Товар</h2>
                    <p class="text-secondary mb-2">
                        Артикул: <span th:text="${product.sku}">SKU</span>
                    </p>
                    <p class="mb-2">
                        <strong th:text="${product.price}">0</strong>
                        <span> руб.</span>
                    </p>
                    <p class="small text-secondary">
                        Остаток: <span th:text="${product.stockQuantity}">0</span>
                    </p>

                    <div class="mt-auto d-flex gap-2 flex-wrap">
                        <a class="btn btn-outline-primary" th:href="@{/catalog/products/{id}(id=${product.id})}">
                            Подробнее
                        </a>

                        <form sec:authorize="isAuthenticated()" th:action="@{/catalog/cart}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <input class="form-control" style="width: 80px;" type="number" name="quantity" min="1" value="1">
                            <button class="btn btn-primary" type="submit">В корзину</button>
                        </form>

                        <a sec:authorize="isAnonymous()" class="btn btn-outline-secondary" th:href="@{/login}">
                            Войти для покупки
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${products.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/catalog(search=${search},categoryId=${categoryId},page=${products.number - 1})}">Назад</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${pageNumber == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/catalog(search=${search},categoryId=${categoryId},page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/catalog(search=${search},categoryId=${categoryId},page=${products.number + 1})}">Вперед</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
