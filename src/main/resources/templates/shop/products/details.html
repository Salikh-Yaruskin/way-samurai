<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Товар</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <h1 th:text="${product.name}">Товар</h1>
    <p>Артикул: <span th:text="${product.sku}">SKU</span></p>
    <p>Цена: <span th:text="${product.price}">0</span></p>
    <p>Остаток: <span th:text="${product.stockQuantity}">0</span></p>
    <p>Статус: <span th:text="${product.active ? 'Активен' : 'Отключен'}">Активен</span></p>
    <p>
        Основная категория:
        <a th:if="${product.primaryCategory != null}" th:href="@{/shop/categories/{id}(id=${product.primaryCategory.id})}" th:text="${product.primaryCategory.name}">Категория</a>
        <span th:if="${product.primaryCategory == null}">Не выбрана</span>
    </p>

    <p><a th:href="@{/shop/products/{id}/edit(id=${product.id})}">Редактировать</a></p>
    <form th:action="@{/shop/products/{id}/delete(id=${product.id})}" method="post">
        <button type="submit">Удалить</button>
    </form>

    <h2>Дополнительные категории</h2>
    <form th:action="@{/shop/products/{id}/categories(id=${product.id})}" method="post">
        <select name="categoryId" required>
            <option value="">Выберите категорию</option>
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Категория</option>
        </select>
        <button type="submit">Прикрепить</button>
    </form>

    <p th:if="${#sets.isEmpty(product.categories)}">Дополнительные категории не прикреплены</p>
    <ul th:if="${!#sets.isEmpty(product.categories)}">
        <li th:each="category : ${product.categories}">
            <a th:href="@{/shop/categories/{id}(id=${category.id})}" th:text="${category.name}">Категория</a>
            <form th:action="@{/shop/products/{id}/categories/{categoryId}/delete(id=${product.id},categoryId=${category.id})}" method="post">
                <button type="submit">Открепить</button>
            </form>
        </li>
    </ul>

    <h2>Заказы с этим товаром</h2>
    <p th:if="${#sets.isEmpty(product.orders)}">Заказов пока нет</p>
    <ul th:if="${!#sets.isEmpty(product.orders)}">
        <li th:each="order : ${product.orders}">
            <a th:href="@{/shop/orders/{id}(id=${order.id})}">
                <span th:text="${order.customerName}">Покупатель</span>
                /
                <span th:text="${order.status}">NEW</span>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
