<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Товары</h1>
        <a class="btn btn-primary" th:href="@{/shop/products/new}">Создать товар</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/shop/products}">
        <div class="row g-3 align-items-end">
            <div class="col-lg-4">
                <label class="form-label" for="search">Поиск</label>
                <input class="form-control" id="search" name="search" th:value="${search}" placeholder="Название или артикул">
            </div>
            <div class="col-lg-3">
                <label class="form-label" for="categoryId">Категория</label>
                <select class="form-select" id="categoryId" name="categoryId">
                    <option value="">Все категории</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:selected="${categoryId != null and category.id == categoryId}"
                            th:text="${category.name}">
                        Категория
                    </option>
                </select>
            </div>
            <div class="col-lg-2">
                <label class="form-label" for="active">Активность</label>
                <select class="form-select" id="active" name="active">
                    <option value="">Все</option>
                    <option value="true" th:selected="${active == true}">Активные</option>
                    <option value="false" th:selected="${active == false}">Отключенные</option>
                </select>
            </div>
            <div class="col-lg-3">
                <button class="btn btn-outline-primary w-100" type="submit">Найти</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Артикул</th>
                    <th>Цена</th>
                    <th>Остаток</th>
                    <th>Основная категория</th>
                    <th>Активность</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products.content}">
                    <td th:text="${product.name}">Товар</td>
                    <td th:text="${product.sku}">SKU</td>
                    <td th:text="${product.price}">100</td>
                    <td th:text="${product.stockQuantity}">10</td>
                    <td>
                        <a th:if="${product.primaryCategory != null}"
                           th:href="@{/shop/categories/{id}(id=${product.primaryCategory.id})}"
                           th:text="${product.primaryCategory.name}">
                            Категория
                        </a>
                        <span th:if="${product.primaryCategory == null}" class="text-secondary">Не выбрана</span>
                    </td>
                    <td>
                        <span class="badge text-bg-success" th:if="${product.active}">Активен</span>
                        <span class="badge text-bg-secondary" th:if="${!product.active}">Отключен</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/shop/products/{id}(id=${product.id})}">Открыть</a>
                    </td>
                </tr>
                <tr th:if="${products.empty}">
                    <td colspan="7" class="text-center text-secondary py-4">Товары не найдены</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${products.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/shop/products(search=${search},categoryId=${categoryId},active=${active},page=${products.number - 1})}">Назад</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${pageNumber == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/shop/products(search=${search},categoryId=${categoryId},active=${active},page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/shop/products(search=${search},categoryId=${categoryId},active=${active},page=${products.number + 1})}">Вперед</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
