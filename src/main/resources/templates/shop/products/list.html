<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Товары</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Товары</h1>
    <p><a th:href="@{/shop/products/new}">Создать товар</a></p>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <form method="get" th:action="@{/shop/products}">
        <p>
            <label for="search">Поиск</label><br>
            <input id="search" name="search" th:value="${search}" placeholder="Название или артикул">
        </p>
        <p>
            <label for="categoryId">Категория</label><br>
            <select id="categoryId" name="categoryId">
                <option value="">Все категории</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:selected="${categoryId != null and category.id == categoryId}" th:text="${category.name}">Категория</option>
            </select>
        </p>
        <p>
            <label for="active">Активность</label><br>
            <select id="active" name="active">
                <option value="">Все</option>
                <option value="true" th:selected="${active == true}">Активные</option>
                <option value="false" th:selected="${active == false}">Отключенные</option>
            </select>
        </p>
        <button type="submit">Найти</button>
    </form>

    <table border="1">
        <thead>
        <tr>
            <th>Название</th>
            <th>Артикул</th>
            <th>Цена</th>
            <th>Остаток</th>
            <th>Основная категория</th>
            <th>Активность</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products.content}">
            <td th:text="${product.name}">Товар</td>
            <td th:text="${product.sku}">SKU</td>
            <td th:text="${product.price}">100</td>
            <td th:text="${product.stockQuantity}">10</td>
            <td>
                <a th:if="${product.primaryCategory != null}" th:href="@{/shop/categories/{id}(id=${product.primaryCategory.id})}" th:text="${product.primaryCategory.name}">Категория</a>
                <span th:if="${product.primaryCategory == null}">Не выбрана</span>
            </td>
            <td th:text="${product.active ? 'Активен' : 'Отключен'}">Активен</td>
            <td><a th:href="@{/shop/products/{id}(id=${product.id})}">Открыть</a></td>
        </tr>
        <tr th:if="${products.empty}">
            <td colspan="7">Товары не найдены</td>
        </tr>
        </tbody>
    </table>

    <p th:if="${products.totalPages > 1}">
        <a th:if="${!products.first}" th:href="@{/shop/products(search=${search},categoryId=${categoryId},active=${active},page=${products.number - 1})}">Назад</a>
        <span th:each="pageNumber : ${#numbers.sequence(0, products.totalPages - 1)}">
            <a th:if="${pageNumber != products.number}" th:href="@{/shop/products(search=${search},categoryId=${categoryId},active=${active},page=${pageNumber})}" th:text="${pageNumber + 1}">1</a>
            <strong th:if="${pageNumber == products.number}" th:text="${pageNumber + 1}">1</strong>
        </span>
        <a th:if="${!products.last}" th:href="@{/shop/products(search=${search},categoryId=${categoryId},active=${active},page=${products.number + 1})}">Вперед</a>
    </p>
</main>
</body>
</html>
