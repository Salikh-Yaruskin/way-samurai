<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create'} ? 'Новый товар' : 'Редактирование товара'">Товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="card mx-auto" style="max-width: 760px;">
        <div class="card-body">
            <h1 class="h3 mb-3" th:text="${mode == 'create'} ? 'Новый товар' : 'Редактирование товара'">Товар</h1>

            <form th:action="${mode == 'create'} ? @{/shop/products} : @{/shop/products/{id}(id=${product.id})}"
                  th:object="${form}"
                  method="post">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка сохранения</div>
                </div>

                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label" for="name">Название</label>
                        <input class="form-control" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="sku">Артикул</label>
                        <input class="form-control" id="sku" th:field="*{sku}" th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="price">Цена</label>
                        <input class="form-control" id="price" type="number" step="0.01" th:field="*{price}" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="stockQuantity">Остаток</label>
                        <input class="form-control" id="stockQuantity" type="number" th:field="*{stockQuantity}" th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="primaryCategoryId">Основная категория</label>
                        <select class="form-select" id="primaryCategoryId" th:field="*{primaryCategoryId}">
                            <option value="">Не выбрана</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Категория</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" id="active" type="checkbox" th:field="*{active}">
                            <label class="form-check-label" for="active">Активен</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                    <a class="btn btn-outline-secondary" th:href="@{/shop/products}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
