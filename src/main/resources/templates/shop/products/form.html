<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create'} ? 'Новый товар' : 'Редактирование товара'">Товар</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1 th:text="${mode == 'create'} ? 'Новый товар' : 'Редактирование товара'">Товар</h1>

    <form th:action="${mode == 'create'} ? @{/shop/products} : @{/shop/products/{id}(id=${product.id})}" th:object="${form}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка сохранения</p>
        </div>

        <p><label for="name">Название</label><br><input id="name" th:field="*{name}"></p>
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка названия</p>

        <p><label for="sku">Артикул</label><br><input id="sku" th:field="*{sku}"></p>
        <p th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}">Ошибка артикула</p>

        <p><label for="price">Цена</label><br><input id="price" type="number" step="0.01" th:field="*{price}"></p>
        <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Ошибка цены</p>

        <p><label for="stockQuantity">Остаток</label><br><input id="stockQuantity" type="number" th:field="*{stockQuantity}"></p>
        <p th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}">Ошибка остатка</p>

        <p>
            <label for="primaryCategoryId">Основная категория</label><br>
            <select id="primaryCategoryId" th:field="*{primaryCategoryId}">
                <option value="">Не выбрана</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Категория</option>
            </select>
        </p>

        <p><label><input type="checkbox" th:field="*{active}"> Активен</label></p>

        <button type="submit">Сохранить</button>
        <a th:href="@{/shop/products}">Отмена</a>
    </form>
</main>
</body>
</html>
