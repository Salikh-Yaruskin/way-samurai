<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.name}">Категория</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <h1 th:text="${category.name}">Категория</h1>
    <p>Slug: <span th:text="${category.slug}">slug</span></p>
    <p th:text="${category.description ?: 'Описание не заполнено'}">Описание</p>
    <p>Статус: <span th:text="${category.active ? 'Активна' : 'Отключена'}">Активна</span></p>

    <p>
        <a th:href="@{/shop/categories/{id}/edit(id=${category.id})}">Редактировать</a>
    </p>
    <form th:action="@{/shop/categories/{id}/delete(id=${category.id})}" method="post">
        <button type="submit">Удалить</button>
    </form>

    <h2>Основная категория у товаров</h2>
    <p th:if="${#sets.isEmpty(category.primaryProducts)}">Нет товаров</p>
    <ul th:if="${!#sets.isEmpty(category.primaryProducts)}">
        <li th:each="product : ${category.primaryProducts}">
            <a th:href="@{/shop/products/{id}(id=${product.id})}" th:text="${product.name}">Товар</a>
        </li>
    </ul>

    <h2>Прикреплена дополнительно</h2>
    <p th:if="${#sets.isEmpty(category.products)}">Нет товаров</p>
    <ul th:if="${!#sets.isEmpty(category.products)}">
        <li th:each="product : ${category.products}">
            <a th:href="@{/shop/products/{id}(id=${product.id})}" th:text="${product.name}">Товар</a>
        </li>
    </ul>
</main>
</body>
</html>
