<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${category.name}">Категория</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h1 class="h3 mb-1" th:text="${category.name}">Категория</h1>
            <div class="text-secondary" th:text="${category.slug}">slug</div>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" th:href="@{/shop/categories/{id}/edit(id=${category.id})}">Редактировать</a>
            <form th:action="@{/shop/categories/{id}/delete(id=${category.id})}" method="post">
                <button class="btn btn-outline-danger" type="submit">Удалить</button>
            </form>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <p class="mb-2" th:text="${category.description ?: 'Описание не заполнено'}">Описание</p>
            <span class="badge text-bg-success" th:if="${category.active}">Активна</span>
            <span class="badge text-bg-secondary" th:if="${!category.active}">Отключена</span>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Основная категория у товаров</h2>
                    <ul class="list-group list-group-flush" th:if="${!#sets.isEmpty(category.primaryProducts)}">
                        <li class="list-group-item px-0" th:each="product : ${category.primaryProducts}">
                            <a th:href="@{/shop/products/{id}(id=${product.id})}" th:text="${product.name}">Товар</a>
                        </li>
                    </ul>
                    <p class="text-secondary mb-0" th:if="${#sets.isEmpty(category.primaryProducts)}">Нет товаров</p>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Прикреплена дополнительно</h2>
                    <ul class="list-group list-group-flush" th:if="${!#sets.isEmpty(category.products)}">
                        <li class="list-group-item px-0" th:each="product : ${category.products}">
                            <a th:href="@{/shop/products/{id}(id=${product.id})}" th:text="${product.name}">Товар</a>
                        </li>
                    </ul>
                    <p class="text-secondary mb-0" th:if="${#sets.isEmpty(category.products)}">Нет товаров</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
