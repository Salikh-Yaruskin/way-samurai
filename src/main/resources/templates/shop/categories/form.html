<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create'} ? 'Новая категория' : 'Редактирование категории'">Категория</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1 th:text="${mode == 'create'} ? 'Новая категория' : 'Редактирование категории'">Категория</h1>

    <form th:action="${mode == 'create'} ? @{/shop/categories} : @{/shop/categories/{id}(id=${category.id})}"
          th:object="${form}"
          method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка сохранения</p>
        </div>

        <p>
            <label for="name">Название</label><br>
            <input id="name" th:field="*{name}">
        </p>
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка названия</p>

        <p>
            <label for="slug">Slug</label><br>
            <input id="slug" th:field="*{slug}">
        </p>
        <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}">Ошибка slug</p>

        <p>
            <label for="description">Описание</label><br>
            <textarea id="description" rows="4" th:field="*{description}"></textarea>
        </p>
        <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Ошибка описания</p>

        <p>
            <label>
                <input type="checkbox" th:field="*{active}">
                Активна
            </label>
        </p>

        <button type="submit">Сохранить</button>
        <a th:href="@{/shop/categories}">Отмена</a>
    </form>
</main>
</body>
</html>
