<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Категории</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Категории</h1>
        <a class="btn btn-primary" th:href="@{/shop/categories/new}">Создать категорию</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/shop/categories}">
        <div class="row g-3 align-items-end">
            <div class="col-md-6">
                <label class="form-label" for="search">Поиск</label>
                <input class="form-control" id="search" name="search" th:value="${search}" placeholder="Название или slug">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="active">Активность</label>
                <select class="form-select" id="active" name="active">
                    <option value="">Все</option>
                    <option value="true" th:selected="${active == true}">Активные</option>
                    <option value="false" th:selected="${active == false}">Отключенные</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-outline-primary w-100" type="submit">Найти</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Slug</th>
                    <th>Активность</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories.content}">
                    <td th:text="${category.name}">Категория</td>
                    <td th:text="${category.slug}">slug</td>
                    <td>
                        <span class="badge text-bg-success" th:if="${category.active}">Активна</span>
                        <span class="badge text-bg-secondary" th:if="${!category.active}">Отключена</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/shop/categories/{id}(id=${category.id})}">Открыть</a>
                    </td>
                </tr>
                <tr th:if="${categories.empty}">
                    <td colspan="4" class="text-center text-secondary py-4">Категории не найдены</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${categories.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${categories.first} ? 'disabled'">
                <a class="page-link" th:href="@{/shop/categories(search=${search},active=${active},page=${categories.number - 1})}">Назад</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, categories.totalPages - 1)}"
                th:classappend="${pageNumber == categories.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/shop/categories(search=${search},active=${active},page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${categories.last} ? 'disabled'">
                <a class="page-link" th:href="@{/shop/categories(search=${search},active=${active},page=${categories.number + 1})}">Вперед</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
