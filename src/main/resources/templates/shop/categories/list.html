<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Категории</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Категории</h1>
    <p><a th:href="@{/shop/categories/new}">Создать категорию</a></p>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <form method="get" th:action="@{/shop/categories}">
        <p>
            <label for="search">Поиск</label><br>
            <input id="search" name="search" th:value="${search}" placeholder="Название или slug">
        </p>
        <p>
            <label for="active">Активность</label><br>
            <select id="active" name="active">
                <option value="">Все</option>
                <option value="true" th:selected="${active == true}">Активные</option>
                <option value="false" th:selected="${active == false}">Отключенные</option>
            </select>
        </p>
        <button type="submit">Найти</button>
    </form>

    <table border="1">
        <thead>
        <tr>
            <th>Название</th>
            <th>Slug</th>
            <th>Активность</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories.content}">
            <td th:text="${category.name}">Категория</td>
            <td th:text="${category.slug}">slug</td>
            <td th:text="${category.active ? 'Активна' : 'Отключена'}">Активна</td>
            <td><a th:href="@{/shop/categories/{id}(id=${category.id})}">Открыть</a></td>
        </tr>
        <tr th:if="${categories.empty}">
            <td colspan="4">Категории не найдены</td>
        </tr>
        </tbody>
    </table>

    <p th:if="${categories.totalPages > 1}">
        <a th:if="${!categories.first}" th:href="@{/shop/categories(search=${search},active=${active},page=${categories.number - 1})}">Назад</a>
        <span th:each="pageNumber : ${#numbers.sequence(0, categories.totalPages - 1)}">
            <a th:if="${pageNumber != categories.number}"
               th:href="@{/shop/categories(search=${search},active=${active},page=${pageNumber})}"
               th:text="${pageNumber + 1}">1</a>
            <strong th:if="${pageNumber == categories.number}" th:text="${pageNumber + 1}">1</strong>
        </span>
        <a th:if="${!categories.last}" th:href="@{/shop/categories(search=${search},active=${active},page=${categories.number + 1})}">Вперед</a>
    </p>
</main>
</body>
</html>
