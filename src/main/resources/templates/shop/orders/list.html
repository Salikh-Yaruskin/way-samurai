<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Заказы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Заказы</h1>
        <a class="btn btn-primary" th:href="@{/shop/orders/new}">Создать заказ</a>
    </div>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form class="card card-body mb-3" method="get" th:action="@{/shop/orders}">
        <div class="row g-3 align-items-end">
            <div class="col-lg-4">
                <label class="form-label" for="search">Поиск</label>
                <input class="form-control" id="search" name="search" th:value="${search}" placeholder="Имя или email покупателя">
            </div>
            <div class="col-lg-3">
                <label class="form-label" for="status">Статус</label>
                <select class="form-select" id="status" name="status">
                    <option value="">Все статусы</option>
                    <option th:each="item : ${statuses}"
                            th:value="${item}"
                            th:selected="${status == item}"
                            th:text="${item}">
                        NEW
                    </option>
                </select>
            </div>
            <div class="col-lg-3">
                <label class="form-label" for="productId">Товар</label>
                <select class="form-select" id="productId" name="productId">
                    <option value="">Все товары</option>
                    <option th:each="product : ${products}"
                            th:value="${product.id}"
                            th:selected="${productId != null and product.id == productId}"
                            th:text="${product.name}">
                        Товар
                    </option>
                </select>
            </div>
            <div class="col-lg-2">
                <button class="btn btn-outline-primary w-100" type="submit">Найти</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Покупатель</th>
                    <th>Email</th>
                    <th>Статус</th>
                    <th>Товаров</th>
                    <th>Создан</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td th:text="${order.customerName}">Покупатель</td>
                    <td th:text="${order.customerEmail}">email</td>
                    <td><span class="badge text-bg-info" th:text="${order.status}">NEW</span></td>
                    <td th:text="${#sets.size(order.products)}">0</td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/shop/orders/{id}(id=${order.id})}">Открыть</a>
                    </td>
                </tr>
                <tr th:if="${orders.empty}">
                    <td colspan="6" class="text-center text-secondary py-4">Заказы не найдены</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3" th:if="${orders.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                <a class="page-link" th:href="@{/shop/orders(search=${search},status=${status},productId=${productId},page=${orders.number - 1})}">Назад</a>
            </li>
            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, orders.totalPages - 1)}"
                th:classappend="${pageNumber == orders.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/shop/orders(search=${search},status=${status},productId=${productId},page=${pageNumber})}"
                   th:text="${pageNumber + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                <a class="page-link" th:href="@{/shop/orders(search=${search},status=${status},productId=${productId},page=${orders.number + 1})}">Вперед</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
