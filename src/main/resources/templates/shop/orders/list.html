<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказы</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Заказы</h1>
    <p><a th:href="@{/shop/orders/new}">Создать заказ</a></p>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <form method="get" th:action="@{/shop/orders}">
        <p><label for="search">Поиск</label><br><input id="search" name="search" th:value="${search}" placeholder="Имя или email покупателя"></p>
        <p>
            <label for="status">Статус</label><br>
            <select id="status" name="status">
                <option value="">Все статусы</option>
                <option th:each="item : ${statuses}" th:value="${item}" th:selected="${status == item}" th:text="${item}">NEW</option>
            </select>
        </p>
        <p>
            <label for="productId">Товар</label><br>
            <select id="productId" name="productId">
                <option value="">Все товары</option>
                <option th:each="product : ${products}" th:value="${product.id}" th:selected="${productId != null and product.id == productId}" th:text="${product.name}">Товар</option>
            </select>
        </p>
        <button type="submit">Найти</button>
    </form>

    <table border="1">
        <thead>
        <tr>
            <th>Покупатель</th>
            <th>Email</th>
            <th>Статус</th>
            <th>Товаров</th>
            <th>Создан</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders.content}">
            <td th:text="${order.customerName}">Покупатель</td>
            <td th:text="${order.customerEmail}">email</td>
            <td th:text="${order.status}">NEW</td>
            <td th:text="${#sets.size(order.products)}">0</td>
            <td th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
            <td><a th:href="@{/shop/orders/{id}(id=${order.id})}">Открыть</a></td>
        </tr>
        <tr th:if="${orders.empty}">
            <td colspan="6">Заказы не найдены</td>
        </tr>
        </tbody>
    </table>

    <p th:if="${orders.totalPages > 1}">
        <a th:if="${!orders.first}" th:href="@{/shop/orders(search=${search},status=${status},productId=${productId},page=${orders.number - 1})}">Назад</a>
        <span th:each="pageNumber : ${#numbers.sequence(0, orders.totalPages - 1)}">
            <a th:if="${pageNumber != orders.number}" th:href="@{/shop/orders(search=${search},status=${status},productId=${productId},page=${pageNumber})}" th:text="${pageNumber + 1}">1</a>
            <strong th:if="${pageNumber == orders.number}" th:text="${pageNumber + 1}">1</strong>
        </span>
        <a th:if="${!orders.last}" th:href="@{/shop/orders(search=${search},status=${status},productId=${productId},page=${orders.number + 1})}">Вперед</a>
    </p>
</main>
</body>
</html>
