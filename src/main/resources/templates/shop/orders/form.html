<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create'} ? 'Новый заказ' : 'Редактирование заказа'">Заказ</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1 th:text="${mode == 'create'} ? 'Новый заказ' : 'Редактирование заказа'">Заказ</h1>

    <form th:action="${mode == 'create'} ? @{/shop/orders} : @{/shop/orders/{id}(id=${order.id})}" th:object="${form}" method="post">
        <p><label for="customerName">Имя покупателя</label><br><input id="customerName" th:field="*{customerName}"></p>
        <p th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}">Ошибка имени</p>

        <p><label for="customerEmail">Email покупателя</label><br><input id="customerEmail" th:field="*{customerEmail}"></p>
        <p th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}">Ошибка email</p>

        <p>
            <label for="status">Статус</label><br>
            <select id="status" th:field="*{status}">
                <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}">NEW</option>
            </select>
        </p>
        <p th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Ошибка статуса</p>

        <button type="submit">Сохранить</button>
        <a th:href="@{/shop/orders}">Отмена</a>
    </form>
</main>
</body>
</html>
