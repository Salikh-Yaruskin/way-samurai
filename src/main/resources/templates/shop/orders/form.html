<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${mode == 'create'} ? 'Новый заказ' : 'Редактирование заказа'">Заказ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loading.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/loading :: loading}"></div>

<main class="container py-4">
    <div class="card mx-auto" style="max-width: 720px;">
        <div class="card-body">
            <h1 class="h3 mb-3" th:text="${mode == 'create'} ? 'Новый заказ' : 'Редактирование заказа'">Заказ</h1>

            <form th:action="${mode == 'create'} ? @{/shop/orders} : @{/shop/orders/{id}(id=${order.id})}"
                  th:object="${form}"
                  method="post">
                <div class="mb-3">
                    <label class="form-label" for="customerName">Имя покупателя</label>
                    <input class="form-control" id="customerName" th:field="*{customerName}" th:classappend="${#fields.hasErrors('customerName')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="customerEmail">Email покупателя</label>
                    <input class="form-control" id="customerEmail" th:field="*{customerEmail}" th:classappend="${#fields.hasErrors('customerEmail')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="status">Статус</label>
                    <select class="form-select" id="status" th:field="*{status}" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                        <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}">NEW</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                    <a class="btn btn-outline-secondary" th:href="@{/shop/orders}">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/loading.js}"></script>
</body>
</html>
