<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заказ</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <p th:if="${message}" th:text="${message}">Сообщение</p>

    <h1>Заказ</h1>
    <p>Создан: <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</span></p>
    <p>Покупатель: <span th:text="${order.customerName}">Имя</span></p>
    <p>Email: <span th:text="${order.customerEmail}">email</span></p>
    <p>Статус: <span th:text="${order.status}">NEW</span></p>

    <p><a th:href="@{/shop/orders/{id}/edit(id=${order.id})}">Редактировать</a></p>
    <form th:action="@{/shop/orders/{id}/delete(id=${order.id})}" method="post">
        <button type="submit">Удалить</button>
    </form>

    <h2>Товары в заказе</h2>
    <form th:action="@{/shop/orders/{id}/products(id=${order.id})}" method="post">
        <select name="productId" required>
            <option value="">Выберите товар</option>
            <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}">Товар</option>
        </select>
        <button type="submit">Добавить</button>
    </form>

    <p th:if="${#sets.isEmpty(order.products)}">Товары не добавлены</p>
    <ul th:if="${!#sets.isEmpty(order.products)}">
        <li th:each="product : ${order.products}">
            <a th:href="@{/shop/products/{id}(id=${product.id})}" th:text="${product.name}">Товар</a>
            /
            <span th:text="${product.sku}">SKU</span>
            /
            <span th:text="${product.price}">0</span>
            <form th:action="@{/shop/orders/{id}/products/{productId}/delete(id=${order.id},productId=${product.id})}" method="post">
                <button type="submit">Убрать</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
