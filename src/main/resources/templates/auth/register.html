<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="max-width: 460px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Регистрация</h1>

            <form th:action="@{/register}" th:object="${request}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Имя пользователя</label>
                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}">
                        Ошибка ввода имени
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                        Ошибка ввода пароля
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Повторите пароль</label>
                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">
                        Ошибка повтора пароля
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Зарегистрироваться
                </button>
            </form>

            <p class="text-center mt-3 mb-0">
                Уже есть аккаунт?
                <a th:href="@{/login}">Войти</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
