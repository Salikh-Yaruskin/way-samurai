<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('Вход')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h1 class="h3 mb-4">Вход</h1>

                    <div class="alert alert-success" th:if="${param.registered}">
                        Регистрация прошла успешно. Теперь войдите.
                    </div>
                    <div class="alert alert-danger" th:if="${param.error}">
                        Неверный логин или пароль.
                    </div>
                    <div class="alert alert-info" th:if="${param.logout}">
                        Вы вышли из системы.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Имя пользователя</label>
                            <input type="text" id="username" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>

                    <p class="mt-3 mb-0">
                        Нет аккаунта?
                        <a th:href="@{/register}">Зарегистрироваться</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>
