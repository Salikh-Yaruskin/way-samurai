<header th:fragment="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">SocialDemo</a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/users}">Пользователи</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/media}">Файлы</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/profile}">Мой профиль</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/friends}">Друзья</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/friend-requests}">Заявки</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <span class="navbar-text text-light" sec:authorize="isAuthenticated()">
                        Привет, <span sec:authentication="name"></span>
                    </span>

                    <a class="btn btn-outline-light btn-sm"
                       sec:authorize="isAnonymous()"
                       th:href="@{/login}">
                        Войти
                    </a>

                    <a class="btn btn-primary btn-sm"
                       sec:authorize="isAnonymous()"
                       th:href="@{/register}">
                        Регистрация
                    </a>

                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>
