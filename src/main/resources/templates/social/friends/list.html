<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('Друзья')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <h1 class="h3 mb-3">Друзья</h1>

    <form class="card mb-4" th:action="@{/friends}" method="get">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label for="name" class="form-label">Имя или логин</label>
                    <input type="text" id="name" name="name" th:value="${name}" class="form-control">
                </div>
                <div class="col-md-4">
                    <label for="addedFrom" class="form-label">Добавлен с</label>
                    <input type="date" id="addedFrom" name="addedFrom" th:value="${addedFrom}" class="form-control">
                </div>
                <div class="col-md-4">
                    <label for="addedTo" class="form-label">Добавлен по</label>
                    <input type="date" id="addedTo" name="addedTo" th:value="${addedTo}" class="form-control">
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Фильтровать</button>
                <a class="btn btn-outline-secondary" th:href="@{/friends}">Сбросить</a>
            </div>
        </div>
    </form>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(friends)}">
        Друзья не найдены.
    </div>

    <div class="card" th:if="${!#lists.isEmpty(friends)}">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Логин</th>
                    <th>Имя</th>
                    <th>Город</th>
                    <th>Интересы</th>
                    <th>Дата добавления</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="friend : ${friends}">
                    <td th:text="${friend.username}">username</td>
                    <td th:text="${friend.displayName}">Имя</td>
                    <td th:text="${friend.city ?: 'Не указан'}">Город</td>
                    <td th:text="${friend.interests ?: 'Не указаны'}">Интересы</td>
                    <td th:text="${#temporals.format(friend.addedAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                    <td>
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/users/{id}(id=${friend.userId})}">
                            Открыть
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>
