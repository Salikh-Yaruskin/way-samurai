<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('Редактирование профиля')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <h1 class="h3 mb-4">Редактирование профиля</h1>

                    <div class="mb-3" th:if="${profile.avatarFilename != null}">
                        <p class="mb-2">Текущее фото</p>
                        <img th:src="@{/profiles/{id}/avatar(id=${profile.user.id})}"
                             alt="Фото профиля"
                             class="avatar-lg rounded border">
                    </div>

                    <form th:action="@{/profile}" th:object="${form}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="displayName" class="form-label">Имя в профиле</label>
                            <input type="text" id="displayName" th:field="*{displayName}" class="form-control" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">
                                Ошибка имени
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="city" class="form-label">Город</label>
                            <input type="text" id="city" th:field="*{city}" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">
                                Ошибка города
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="interests" class="form-label">Интересы</label>
                            <textarea id="interests" th:field="*{interests}" rows="4" class="form-control"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('interests')}" th:errors="*{interests}">
                                Ошибка интересов
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="bio" class="form-label">О себе</label>
                            <textarea id="bio" th:field="*{bio}" rows="5" class="form-control"></textarea>
                            <div class="text-danger small" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}">
                                Ошибка описания
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="avatar" class="form-label">Фото профиля</label>
                            <input type="file" id="avatar" name="avatar" accept="image/*" class="form-control">
                            <div class="text-danger small" th:if="${#fields.hasErrors('avatar')}" th:errors="*{avatar}">
                                Ошибка фото
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a class="btn btn-outline-secondary" th:href="@{/profile}">Назад</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>
