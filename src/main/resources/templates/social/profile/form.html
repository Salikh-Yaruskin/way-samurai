<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование профиля</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Редактирование профиля</h1>

    <p th:if="${profile.avatarFilename != null}">
        Текущее фото:<br>
        <img th:src="@{/profiles/{id}/avatar(id=${profile.user.id})}" alt="Фото профиля" width="160">
    </p>

    <form th:action="@{/profile}" th:object="${form}" method="post" enctype="multipart/form-data">
        <p>
            <label for="displayName">Имя в профиле</label><br>
            <input type="text" id="displayName" th:field="*{displayName}" required>
        </p>
        <p th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">Ошибка имени</p>

        <p>
            <label for="city">Город</label><br>
            <input type="text" id="city" th:field="*{city}">
        </p>
        <p th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Ошибка города</p>

        <p>
            <label for="interests">Интересы</label><br>
            <textarea id="interests" th:field="*{interests}" rows="4" cols="50"></textarea>
        </p>
        <p th:if="${#fields.hasErrors('interests')}" th:errors="*{interests}">Ошибка интересов</p>

        <p>
            <label for="bio">О себе</label><br>
            <textarea id="bio" th:field="*{bio}" rows="5" cols="50"></textarea>
        </p>
        <p th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}">Ошибка описания</p>

        <p>
            <label for="avatar">Фото профиля</label><br>
            <input type="file" id="avatar" name="avatar" accept="image/*">
        </p>
        <p th:if="${#fields.hasErrors('avatar')}" th:errors="*{avatar}">Ошибка фото</p>

        <button type="submit">Сохранить</button>
    </form>

    <p><a th:href="@{/profile}">Назад к профилю</a></p>
</main>
</body>
</html>
