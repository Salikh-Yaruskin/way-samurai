<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('Мой профиль')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
                <div>
                    <h1 class="h3 mb-3">Мой профиль</h1>
                    <p class="mb-1"><b>Логин:</b> <span th:text="${profile.user.username}">username</span></p>
                    <p class="mb-1"><b>Имя:</b> <span th:text="${profile.displayName}">Имя</span></p>
                    <p class="mb-1"><b>Город:</b> <span th:text="${profile.city ?: 'Не указан'}">Город</span></p>
                    <p class="mb-1"><b>Интересы:</b> <span th:text="${profile.interests ?: 'Не указаны'}">Интересы</span></p>
                    <p class="mb-3"><b>О себе:</b> <span th:text="${profile.bio ?: 'Не указано'}">О себе</span></p>
                    <a class="btn btn-primary" th:href="@{/profile/edit}">Редактировать профиль</a>
                </div>

                <img th:if="${profile.avatarFilename != null}"
                     th:src="@{/profiles/{id}/avatar(id=${profile.user.id})}"
                     alt="Фото профиля"
                     class="avatar-lg rounded border">
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>
