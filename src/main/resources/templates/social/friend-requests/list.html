<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявки в друзья</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Заявки в друзья</h1>

    <p th:if="${message}" th:text="${message}">Сообщение</p>
    <p th:if="${error}" th:text="${error}">Ошибка</p>

    <h2>Входящие заявки</h2>
    <p th:if="${#lists.isEmpty(incomingRequests)}">Входящих заявок нет.</p>
    <table th:if="${!#lists.isEmpty(incomingRequests)}" border="1">
        <thead>
        <tr>
            <th>Пользователь</th>
            <th>Дата заявки</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="request : ${incomingRequests}">
            <td>
                <a th:href="@{/users/{id}(id=${request.requester.id})}"
                   th:text="${request.requester.profile == null ? request.requester.username : request.requester.profile.displayName}">
                    Пользователь
                </a>
            </td>
            <td th:text="${#temporals.format(request.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
            <td>
                <form th:action="@{/friend-requests/{id}/accept(id=${request.id})}" method="post">
                    <button type="submit">Принять</button>
                </form>
                <form th:action="@{/friend-requests/{id}/reject(id=${request.id})}" method="post">
                    <button type="submit">Отклонить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Исходящие заявки</h2>
    <p th:if="${#lists.isEmpty(outgoingRequests)}">Исходящих заявок нет.</p>
    <table th:if="${!#lists.isEmpty(outgoingRequests)}" border="1">
        <thead>
        <tr>
            <th>Пользователь</th>
            <th>Дата заявки</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="request : ${outgoingRequests}">
            <td>
                <a th:href="@{/users/{id}(id=${request.receiver.id})}"
                   th:text="${request.receiver.profile == null ? request.receiver.username : request.receiver.profile.displayName}">
                    Пользователь
                </a>
            </td>
            <td th:text="${#temporals.format(request.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
            <td>
                <form th:action="@{/friend-requests/{id}/cancel(id=${request.id})}" method="post">
                    <button type="submit">Отменить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
