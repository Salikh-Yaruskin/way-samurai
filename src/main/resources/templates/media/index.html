<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Файлы</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Файлы</h1>

    <p th:if="${uploadedFileId != null}">
        Файл загружен:
        <a th:href="@{/media/{id}(id=${uploadedFileId})}" target="_blank">открыть</a>
    </p>
    <p th:if="${deleted}">Файл удален.</p>

    <form th:action="@{/media}" method="post" enctype="multipart/form-data">
        <p>
            <label for="file">Файл</label><br>
            <input type="file" id="file" name="file" required>
        </p>
        <button type="submit">Загрузить</button>
    </form>

    <h2>Загруженные файлы</h2>
    <p th:if="${#lists.isEmpty(files)}">Файлов пока нет.</p>

    <table th:if="${!#lists.isEmpty(files)}" border="1">
        <thead>
        <tr>
            <th>Название</th>
            <th>Тип</th>
            <th>Размер</th>
            <th>Дата</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="file : ${files}">
            <td th:text="${file.originalFilename}">file.txt</td>
            <td th:text="${file.contentType}">text/plain</td>
            <td th:text="${file.sizeBytes}">0</td>
            <td th:text="${#temporals.format(file.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
            <td>
                <a th:href="@{/media/{id}(id=${file.id})}" target="_blank">Открыть</a>
                |
                <a th:href="@{/media/{id}/download(id=${file.id})}">Скачать</a>
                |
                <form th:action="@{/media/{id}/delete(id=${file.id})}" method="post">
                    <button type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
