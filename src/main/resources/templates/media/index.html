<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Файлы</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>Файлы</h1>

    <section>
        <h2>Загрузка файла</h2>

        <p th:if="${uploadedFileId != null}">
            Файл загружен.
            <a th:href="@{/media/{id}(id=${uploadedFileId})}" target="_blank">Открыть</a>
        </p>

        <p th:if="${deleted}">
            Файл удален.
        </p>

        <form th:action="@{/media}" method="post" enctype="multipart/form-data">
            <p>
                <label for="file">Фото, видео или документ</label><br>
                <input id="file"
                       name="file"
                       type="file"
                       accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"
                       required>
            </p>

            <button type="submit">Загрузить</button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Загруженные файлы: <span th:text="${#lists.size(files)}">0</span></h2>

        <p th:if="${#lists.isEmpty(files)}">
            Файлы еще не загружены.
        </p>

        <div th:if="${!#lists.isEmpty(files)}">
            <article th:each="file : ${files}">
                <h3 th:text="${file.originalFilename}">filename.jpg</h3>

                <img th:if="${file.type.name() == 'PHOTO'}"
                     th:src="@{/media/{id}(id=${file.id})}"
                     width="320"
                     th:alt="${file.originalFilename}">

                <video th:if="${file.type.name() == 'VIDEO'}"
                       width="320"
                       controls>
                    <source th:src="@{/media/{id}(id=${file.id})}" th:type="${file.contentType}">
                </video>

                <p th:if="${file.type.name() == 'DOCUMENT'}">
                    Документ
                </p>

                <p>
                    <span th:text="${file.type}">PHOTO</span>
                    /
                    <span th:text="${file.contentType}">image/jpeg</span>
                    /
                    <span th:text="${file.sizeBytes}">0</span>
                    bytes
                </p>

                <p>
                    <a th:href="@{/media/{id}(id=${file.id})}" target="_blank">Просмотр</a>
                    |
                    <a th:href="@{/media/{id}/download(id=${file.id})}">Скачать</a>
                </p>

                <form th:action="@{/media/{id}/delete(id=${file.id})}" method="post">
                    <input type="hidden"
                           th:if="${_csrf != null}"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">
                    <button type="submit">Удалить</button>
                </form>

                <hr>
            </article>
        </div>
    </section>
</main>

</body>
</html>
