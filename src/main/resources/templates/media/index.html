<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/assets :: head('Файлы')}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="container page-shell">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 mb-3">Загрузка файла</h1>

                    <div class="alert alert-success" th:if="${uploadedFileId != null}">
                        Файл загружен:
                        <a th:href="@{/media/{id}(id=${uploadedFileId})}" target="_blank">открыть</a>
                    </div>
                    <div class="alert alert-info" th:if="${deleted}">Файл удален.</div>

                    <form th:action="@{/media}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="file" class="form-label">Файл</label>
                            <input type="file" id="file" name="file" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Загрузить</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h4 mb-3">Загруженные файлы</h2>

                    <div class="alert alert-secondary" th:if="${#lists.isEmpty(files)}">
                        Файлов пока нет.
                    </div>

                    <div class="table-responsive" th:if="${!#lists.isEmpty(files)}">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>Название</th>
                                <th>Тип</th>
                                <th>Размер</th>
                                <th>Дата</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="file : ${files}">
                                <td th:text="${file.originalFilename}">file.txt</td>
                                <td th:text="${file.contentType}">text/plain</td>
                                <td th:text="${file.sizeBytes}">0</td>
                                <td th:text="${#temporals.format(file.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                                <td>
                                    <div class="d-flex gap-2 flex-wrap">
                                        <a class="btn btn-outline-primary btn-sm"
                                           th:href="@{/media/{id}(id=${file.id})}"
                                           target="_blank">
                                            Открыть
                                        </a>
                                        <a class="btn btn-outline-secondary btn-sm"
                                           th:href="@{/media/{id}/download(id=${file.id})}">
                                            Скачать
                                        </a>
                                        <form th:action="@{/media/{id}/delete(id=${file.id})}" method="post">
                                            <button type="submit" class="btn btn-outline-danger btn-sm">Удалить</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/assets :: scripts}"></th:block>
</body>
</html>
